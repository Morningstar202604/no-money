<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#111c2e"/>
      <stop offset="100%" stop-color="#0f2f2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#f5b301"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <rect x="88" y="82" width="72" height="72" rx="16" fill="#2dd4bf"/>
  <path d="M124 100 L108 124 H122 L118 140 L138 112 H124 Z" fill="#0b1120"/>

  <text x="180" y="114" font-family="'Noto Sans CJK SC',system-ui,-apple-system,sans-serif"
        font-size="34" font-weight="700" fill="#e8eef6">没钱 No Money</text>
  <text x="180" y="144" font-family="'Noto Sans CJK SC',system-ui,-apple-system,sans-serif"
        font-size="17" fill="#7d8ea6">劳动者权益导航与办事平台</text>

  <text x="88" y="252" font-family="'Noto Sans CJK SC',system-ui,-apple-system,sans-serif"
        font-size="42" font-weight="700" fill="#e8eef6">该做什么</text>
  <text x="88" y="310" font-family="'Noto Sans CJK SC',system-ui,-apple-system,sans-serif"
        font-size="42" font-weight="700" fill="#2dd4bf">能拿什么</text>
  <text x="88" y="368" font-family="'Noto Sans CJK SC',system-ui,-apple-system,sans-serif"
        font-size="42" font-weight="700" fill="#f5b301">去哪办</text>

  <rect x="88" y="396" width="164" height="4" rx="2" fill="url(#accent)"/>

  <text x="88" y="440" font-family="'Noto Sans CJK SC',system-ui,-apple-system,sans-serif"
        font-size="20" fill="#94a3b8">社保医保、公积金、工伤、失业、生育、退休，一条条摊开。</text>

  <g font-family="'Noto Sans CJK SC',system-ui,-apple-system,sans-serif" font-size="18" fill="#94a3b8">
    <circle cx="96" cy="486" r="5" fill="#2dd4bf"/>
    <text x="116" y="493">每条都指到官方入口，不代办、不代缴</text>

    <circle cx="96" cy="526" r="5" fill="#f5b301"/>
    <text x="116" y="533">不知道就标「待核实」，不编数字</text>

    <circle cx="96" cy="566" r="5" fill="#38bdf8"/>
    <text x="116" y="573">纯本地 · 无后端 · 数据不出设备 · 离线可用</text>
  </g>

  <g transform="translate(820, 214)">
    <rect width="300" height="310" rx="20" fill="#ffffff" fill-opacity="0.04"
          stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="28" y="48" font-family="'Noto Sans CJK SC',system-ui,-apple-system,sans-serif"
          font-size="20" font-weight="600" fill="#e8eef6">本周待办</text>
    <text x="28" y="72" font-family="'Noto Sans CJK SC',system-ui,-apple-system,sans-serif"
          font-size="13" fill="#5f738c">按你的城市与身份生成</text>

    <line x1="28" y1="92" x2="272" y2="92" stroke="#ffffff" stroke-opacity="0.1"/>

    <g font-family="'Noto Sans CJK SC',system-ui,-apple-system,sans-serif" font-size="14" fill="#c8d4e3">
      <rect x="28" y="116" width="16" height="16" rx="4" fill="none" stroke="#2dd4bf" stroke-opacity="0.7"/>
      <text x="56" y="129">确认劳动合同与试用期</text>

      <rect x="28" y="162" width="16" height="16" rx="4" fill="none" stroke="#2dd4bf" stroke-opacity="0.7"/>
      <text x="56" y="175">查社保是否已缴</text>

      <rect x="28" y="208" width="16" height="16" rx="4" fill="none" stroke="#2dd4bf" stroke-opacity="0.7"/>
      <text x="56" y="221">公积金开户 / 租房提取</text>
    </g>

    <text x="28" y="266" font-family="'Noto Sans CJK SC',system-ui,-apple-system,sans-serif"
          font-size="12" fill="#5f738c">示例清单，实际按你的情况生成</text>
  </g>

  <text x="88" y="600" font-family="'Noto Sans CJK SC',ui-monospace,Consolas,monospace"
        font-size="14" fill="#5f738c">gitcode.com/badhope/no-money  ·  MIT License</text>
</svg>
