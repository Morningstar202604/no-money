<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="没钱 No Money — 灵活就业者收入精算与权益决策平台。为外卖骑手、网约车司机等灵活就业者提供收入测算、税务优化、社保规划、AI 决策建议。" />
  <meta name="theme-color" content="#0d9488" />
  <title>没钱 No Money — 灵活就业者收入精算与权益决策平台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230d9488'/%3E%3Ctext x='50' y='72' font-size='55' text-anchor='middle' fill='white' font-weight='bold'%3E没%3C/text%3E%3C/svg%3E" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    /* 默认深色（与 variables.css :root 一致），data-theme=light 时覆盖为浅色；
       Vue 挂载前的首帧按最终主题渲染，避免深色用户每次先闪一帧浅色（FOUC） */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      background: #111c2e;
      color: #e8eef6;
      -webkit-font-smoothing: antialiased;
    }
    html[data-theme='light'] body {
      background: #f8fafc;
      color: #1e293b;
    }
    #app { height: 100%; }
  </style>
  <script>
    ;(function () {
      try {
        var t = localStorage.getItem('theme')
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (!dark) document.documentElement.setAttribute('data-theme', 'light')
      } catch (e) { /* 存储不可用时按默认深色渲染 */ }
    })()
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
